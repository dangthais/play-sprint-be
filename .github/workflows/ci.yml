name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: qp
          POSTGRES_PASSWORD: qp_ci
          POSTGRES_DB: qp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qp -d qp_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Chỉ là DB tạm của job CI, không phải secret.
      TEST_DATABASE_URL: postgres://qp:qp_ci@localhost:5432/qp_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        target: [api, games]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
